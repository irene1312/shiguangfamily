/* 拾光 · 轻手帐视觉语言 */
:root{--bg:#fbfaf6;--ink:#4c453d;--muted:#948b80;--accent:#a58d76}
body{background:#fbfaf6;color:var(--ink)}

.eyebrow{letter-spacing:2px;font-weight:400;font-size:10px}

.hero:after{content:"";position:absolute;right:19px;top:13px;font-size:34px;color:#fff9e6aa;font-family:serif}

.card strong{font-family:"Songti SC","Noto Serif SC",serif;font-weight:400}
.story{font-family:"Songti SC",serif;font-size:17px;line-height:2}
.pill{background:#f1ede6}

.avatar{overflow:hidden;display:grid;place-items:center;padding:0}

/* 轻盈细节与过渡：移除首页符号，丰富但克制的手帐质感 */
.hero:after{display:none!important}
:root{--paper:#fdfbf7;--sage:#9daea0;--clay:#c69d8b;--sand:#e9dbc6}
body{background:linear-gradient(125deg,#fcfaf5,#faf8f4 48%,#f7f7f0);color:#443d38}

</style><style>.profileBanner{height:120px;margin:-20px -20px 18px;background:linear-gradient(125deg,#c5cdbb,#e6d6bd 50%,#b7c9c1);border-radius:17px 17px 6px 6px;position:relative}.identityCard{overflow:hidden}.bannerEdit{position:absolute;bottom:10px;right:12px;padding:8px 11px;border-radius:20px;background:#fffdf1e8;color:#63594d;font-size:11px}.familyCover{height:155px;margin:-22px -22px 19px;border-radius:12px 12px 4px 4px;background:linear-gradient(135deg,#d5bba2,#a9bdaf 65%,#7e9c93);position:relative;overflow:hidden}.familyCoverText{position:absolute;top:15px;left:16px;font-family:serif;letter-spacing:2px;font-size:11px;color:white}.profileBackgroundPreview{height:135px;border-radius:13px;margin:16px 0;background:linear-gradient(130deg,#c4d2c4,#e7d8bd,#d0b2a1)}.familyCoverPreview{margin:20px 0}.uploadAvatar{max-width:100%}</style></head><body><main id="app"></main><nav class="nav" id="nav"></nav><div id="modal"></div><div id="toast"></div><script>
const samples=[{id:1,title:'杭州的秋天',date:'2026-10-03',who:'妈妈',place:'杭州 · 西湖',text:'那天的阳光很好，湖面亮晶晶的。平凡的散步，也值得记住。',album:'旅行日记',art:'a',archived:false},{id:2,title:'家的味道',date:'2026-09-28',who:'爸爸',place:'家里',text:'今天做了好多好吃的，等你回来一起吃。',album:'日常生活',art:'b',archived:false},{id:3,title:'路上的风景',date:'2026-08-12',who:'我',place:'西安',text:'傍晚的风吹过城墙，刚好拍下这一刻。',album:'旅行日记',art:'c',archived:true},{id:4,title:'一些小日子',date:'2025-10-09',who:'妈妈',place:'家里',text:'普通的日子里，也有很多可爱的瞬间。',album:'珍贵回忆',art:'d',archived:true}];let family=[{name:'爸爸',icon:'👨',role:'家庭成员'},{name:'妈妈',icon:'👩',role:'家庭成员'},{name:'我',icon:'🌷',role:'管理员'}],photos=[...samples],albums=['旅行日记','日常生活','珍贵回忆'],tab='home',filter='all',query='',selected=[],pending=[],notice=false;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));try{const saved=JSON.parse(localStorage.getItem('shiguangFamilyDemo')||'null');if(Array.isArray(saved)&&saved.length===3)family=saved}catch(e){}function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2400)}let currentMember=2;try{let cm=Number(localStorage.getItem('shiguangCurrentMember'));if(Number.isInteger(cm)&&cm>=0&&cm<3)currentMember=cm}catch(e){}function orderedFamily(){return [currentMember,...family.map((_,i)=>i).filter(i=>i!==currentMember)]}function chooseCurrent(i){currentMember=i;try{localStorage.setItem('shiguangCurrentMember',String(i))}catch(e){}closeSheet();render();toast('已切换当前身份（仅演示）')}let familyCover='';try{familyCover=localStorage.getItem('shiguangFamilyCover')||''}catch(e){}function photoBackground(src){return src?' style="background-image:linear-gradient(0deg,#302b2750,#302b2710),url('+JSON.stringify(src).replace(/"/g,'&quot;')+');background-size:cover;background-position:center"':''}function nav(){ $('nav').innerHTML=[['home','⌂','时光'],['albums','▦','相册'],['upload','+',''],['search','⌕','搜索'],['me','◯','我的']].map(([id,ic,label])=>'<button class="'+(tab===id?'active ':'')+(id==='upload'?'plus':'')+'" onclick="'+(id==='upload'?'openUpload()':"go('"+id+"')")+'"><i>'+ic+'</i>'+label+'</button>').join('')}function go(t){tab=t;render();scrollTo({top:0,behavior:'smooth'})}function card(p){return '<button class="card" onclick="detail('+p.id+')"><div class="art '+p.art+'"></div><strong>'+esc(p.title)+'</strong><span class="muted">'+esc(p.date)+' · '+esc(p.who)+(p.archived?' · 已归档':'')+'</span></button>'}function render(){nav();let a=$('app');if(tab==='home')a.innerHTML='<div class="eyebrow">OUR FAMILY JOURNAL</div><div class="row"><div><h1>拾光<span style="color:#b59c81">。</span></h1><div class="muted">把平凡的日子，慢慢收藏起来。</div></div><span style="font-size:30px;color:#b69d86">♡</span></div><div class="hero"><div><div class="eyebrow" style="color:#f8eadb">LITTLE MOMENTS, BIG MEMORIES</div><h2>日子很长，回忆很暖。</h2><div style="font-size:12px">属于我们三个人的时光</div></div></div><div class="row"><h2>最近的故事</h2><button class="pill" onclick="go(\'albums\')">查看全部 →</button></div><div class="grid">'+photos.slice(0,2).map(card).join('')+'</div><div class="panel"><div class="eyebrow">FAMILY UPDATES</div><h2 style="margin:9px 0">家人的新动态</h2><p class="muted">妈妈收藏了新的生活瞬间 · '+photos.length+' 张回忆正在这里等你</p></div><div class="panel"><div class="eyebrow">ON THIS DAY</div><h2 style="margin:9px 0">时光回忆</h2><p class="muted">翻翻以前的照片，看看我们一起走过的日子。</p><button class="pill" onclick="detail(4)">看看过去 →</button></div>';else if(tab==='albums')a.innerHTML='<div class="eyebrow">OUR COLLECTIONS</div><h1>相册</h1><p class="muted">全部照片是完整照片库；按相册是你为照片整理的主题合集。一张照片可以属于多个相册，未分类照片也会留在全部照片中。</p><div class="row" style="justify-content:start;flex-wrap:wrap;margin:24px 0">'+[['all','全部照片'],['albums','按相册'],['archived','已归档']].map(([v,t])=>'<button class="pill '+(filter===v?'active':'')+'" onclick="filter=\''+v+'\';render()">'+t+'</button>').join('')+'</div>'+(filter==='albums'?'<div class="row"><h2>我们的故事</h2><button class="pill" onclick="newAlbum()">＋ 新建</button></div>'+albums.map((x,i)=>'<button class="albumTile" onclick="albumView(\''+esc(x)+'\')"><div class="albumCover art '+(photos.find(p=>p.album===x)?.art||['a','b','c','d'][i%4])+'"><span class="coverLabel">'+String(i+1).padStart(2,'0')+' / FAMILY ALBUM</span></div><div class="albumInfo"><div><strong>'+esc(x)+'</strong><div class="muted">'+photos.filter(p=>p.album===x).length+' 张照片</div></div><span>↗</span></div></button>').join(''):'<div class="grid">'+photos.filter(p=>filter!=='archived'||p.archived).map(card).join('')+'</div>');else if(tab==='search')a.innerHTML='<div class="eyebrow">FIND A MEMORY</div><h1>寻找回忆</h1><input class="field" placeholder="搜索人物、地点、相册、描述…" value="'+esc(query)+'" oninput="query=this.value;searchResults()"><div id="results"></div>';else a.innerHTML='<div class="eyebrow">OUR LITTLE SPACE</div><h1>我的</h1><div class="identityCard"><div class="profileBanner"'+photoBackground(family[currentMember].background||'')+'><button class="bannerEdit" onclick="editMember(currentMember)">更换个人背景 ↗</button></div><div class="eyebrow">THIS IS ME · 当前使用者</div><div class="identityMain">'+(family[currentMember].photo?'<img src="'+family[currentMember].photo+'" alt="我的头像">':'<span>'+family[currentMember].icon+'</span>')+'<div><strong>'+esc(family[currentMember].name)+'</strong><p class="muted">我们家的拾光，欢迎回来。</p></div><button class="pill" onclick="editMember(currentMember)">编辑</button></div></div><div class="panel"><div class="familyCover"'+photoBackground(familyCover)+'><div class="familyCoverText">OUR LITTLE WORLD</div><button class="bannerEdit" onclick="editFamilyCover()">更换家庭背景 ↗</button></div><div class="eyebrow">FAMILY MEMBERS</div><h2>我们的三人世界</h2><div class="familyAvatars">'+orderedFamily().map(i=>{let m=family[i];return '<button class="memberMini" onclick="editMember('+i+')"><span>'+(m.photo?'<img src="'+m.photo+'" alt="头像">':m.icon)+'</span><small>'+esc(m.name)+'</small>'+(i===currentMember?'<em>当前</em>':'')+'</button>'}).join('')+'</div><button class="pill" onclick="familySettings()">成员管理 · 切换身份 →</button><p class="muted">🔒 仅受邀成员可查看照片（正式版规划，当前演示不提供真实权限保护）</p></div><div class="panel"><div class="eyebrow">CLOUD STORAGE · DEMO</div><h2>1.8 GB <span class="muted">/ 3.0 GB</span></h2><div style="height:8px;border-radius:8px;background:#dfd6ca"><div style="width:60%;height:100%;border-radius:8px;background:#a88b6d"></div></div><p class="muted">空间数字仅为原型示例</p></div><div class="line row"><span>微信订阅消息提醒（演示）</span><button class="pill" onclick="notice=!notice;render();toast(\'偏好已在当前演示中切换\')">'+(notice?'已开启':'已关闭')+'</button></div><div class="line row"><span>备份与归档</span><button class="pill" onclick="showArchive()">查看 →</button></div>';if(tab==='search')searchResults()}function searchResults(){let q=(query||'').toLowerCase();$('results').innerHTML='<div class="muted" style="margin:20px 0">按照片标题、描述、人物、地点和相册筛选</div><div class="grid">'+photos.filter(p=>[p.title,p.text,p.who,p.place,p.album,p.date].join(' ').toLowerCase().includes(q)).map(card).join('')+'</div>'}function closeSheet(){ $('modal').innerHTML=''}function sheet(s){$('modal').innerHTML='<div class="sheet" onclick="if(event.target===this)closeSheet()"><section><div class="sheetGrip"></div>'+s+'</section></div>'}function detail(id){let p=photos.find(x=>x.id===id);if(!p)return;sheet('<div class="row"><span class="eyebrow">PHOTO STORY</span><button class="pill" onclick="closeSheet()">关闭 ✕</button></div><div class="art '+p.art+'" style="height:320px;margin:20px 0"></div><div class="eyebrow">'+esc(p.date)+'</div><h2 style="margin:10px 0">'+esc(p.title)+'</h2><div class="story">'+esc(p.text||'这一刻，值得收藏。')+'</div><p class="muted">'+esc(p.who)+' 上传 · '+esc(p.place)+' · '+esc(p.album)+'</p><div class="tag">'+(p.archived?'已归档 · 原图在家庭电脑':'云端原图 · 演示')+'</div><div class="row"><button class="pill" onclick="editPhoto('+id+')">编辑信息</button><button class="pill" onclick="toast(\'演示原型暂不支持下载原图\')">下载</button><button class="pill" onclick="deletePhoto('+id+')">删除</button></div>')}function editPhoto(id){let p=photos.find(x=>x.id===id);sheet('<h2>编辑照片故事</h2><label>标题<input id="et" class="field" value="'+esc(p.title)+'"></label><label>描述<textarea id="ed" class="field" rows="4">'+esc(p.text)+'</textarea></label><label>所属相册<select id="ea" class="field">'+albums.map(x=>'<option '+(x===p.album?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select></label><button class="primary" onclick="saveEdit('+id+')">保存修改</button>')}function saveEdit(id){let p=photos.find(x=>x.id===id);p.title=$('et').value;p.text=$('ed').value;p.album=$('ea').value;closeSheet();render();toast('修改已保存（仅当前页面）')}function deletePhoto(id){if(confirm('确定将这张演示照片移除吗？')){photos=photos.filter(p=>p.id!==id);closeSheet();render();toast('已移除')}}function newAlbum(){sheet('<div class="row"><h2>创建新相册</h2><button class="pill" onclick="closeSheet()">关闭 ✕</button></div><input id="newname" class="field" placeholder="例如：2026 国庆旅行"><button class="primary" onclick="addAlbum()">创建相册</button>')}function addAlbum(){let v=$('newname').value.trim();if(!v)return toast('请输入相册名称');if(!albums.includes(v))albums.push(v);closeSheet();filter='albums';render();toast('相册已创建')}function albumView(name){sheet('<div class="row"><h2>'+esc(name)+'</h2><button class="pill" onclick="closeSheet()">关闭</button></div><div class="grid">'+photos.filter(p=>p.album===name).map(card).join('')+'</div><p class="muted">同一张照片可加入多个相册：正式版将支持多选关系。</p>')}function openUpload(){pending=[];sheet('<div class="row"><div class="eyebrow">NEW MEMORIES</div><button class="pill" onclick="closeSheet()">关闭 ✕</button></div><h2>上传照片</h2><p class="muted">上传后进入全部照片，也可以选一个相册。演示版不会把照片传到服务器。</p><input type="file" accept="image/*" multiple id="files" class="field" onchange="previewFiles(this)"><div id="preview" class="thumbs"></div><label>共同描述（选填）<textarea class="field" id="caption" placeholder="今天发生了什么值得记住的小事？"></textarea></label><label>相册（选填）<select id="album" class="field"><option value="">暂不分类</option>'+albums.map(x=>'<option>'+esc(x)+'</option>').join('')+'</select></label><label>地点（选填）<input id="place" class="field" placeholder="例如：杭州 · 西湖"></label><p class="muted">默认一家三口可见 · 演示版不会上传至服务器</p><button class="primary" onclick="uploadDemo()">上传照片</button>')}function previewFiles(el){pending=[...el.files];$('preview').innerHTML='';pending.slice(0,18).forEach(f=>{let img=document.createElement('img');img.src=URL.createObjectURL(f);$('preview').append(img)});toast('已选择 '+pending.length+' 张照片')}function uploadDemo(){if(!pending.length)return toast('请先选择照片');let duplicates=pending.filter(f=>photos.some(p=>p.title===f.name));if(duplicates.length&&!confirm('发现 '+duplicates.length+' 张可能重复的照片，仍然继续吗？'))return;let cap=$('caption').value,album=$('album').value||'未分类',place=$('place').value;pending.forEach(f=>photos.unshift({id:Date.now()+Math.random(),title:f.name.replace(/\.[^.]+$/,''),date:new Date().toISOString().slice(0,10),who:'我',place,text:cap,album,art:'c',archived:false}));closeSheet();go('albums');toast('已模拟上传 '+pending.length+' 张照片');pending=[]}function avatarMarkup(m,i,cls){return '<button class="'+cls+'" onclick="editMember('+i+')">'+(m.photo?'<img src="'+m.photo+'" alt="头像">':m.icon)+'</button>'}function familySettings(){sheet('<div class="row"><div><div class="eyebrow">PRIVATE FAMILY SPACE</div><h2 style="margin:8px 0">家庭成员</h2></div><button class="pill" onclick="closeSheet()">完成 ✕</button></div><p class="muted">家人头像与昵称可在此预览编辑。正式版只有被邀请并经管理员批准的微信账号才能查看照片。</p><div id="familyList">'+orderedFamily().map(i=>{let m=family[i];return '<div class="member">'+avatarMarkup(m,i,'avatar')+'<div><strong>'+esc(m.name)+'</strong><div class="muted">'+m.role+' · 点击头像编辑</div></div>'+(i===currentMember?'<span class="currentTag">当前身份</span>':'<button class="pill" onclick="chooseCurrent('+i+')">设为我</button>')+'<button class="pill" onclick="editMember('+i+')">编辑</button></div>'}).join('')+'</div><button class="pill" onclick="editFamilyCover()">更换家庭公共背景 →</button><button class="primary" onclick="inviteFamily()">＋ 邀请家人</button><div class="security"><strong>🔒 私密空间 · 规划中的安全机制</strong><p class="muted">仅受邀账号可访问，服务端验证成员身份，管理员可移除成员并立即撤销访问权限。当前公开网页是无登录的 UI 演示，不具备真实访问控制，请勿上传私人照片。</p></div>')}function imagePicker(event,onDone){let file=event.target.files&&event.target.files[0];if(!file)return;if(!file.type.startsWith('image/'))return toast('请选择图片');if(file.size>8*1024*1024)return toast('请选择小于8MB的图片');const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let max=1100,scale=Math.min(1,max/Math.max(img.width,img.height));let c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);onDone(c.toDataURL('image/jpeg',.75))};img.onerror=()=>{URL.revokeObjectURL(url);toast('图片读取失败')};img.src=url}function chooseProfileBackground(event,i){imagePicker(event,data=>{family[i].background=data;let el=document.querySelector('.profileBackgroundPreview');if(el){el.style.backgroundImage='linear-gradient(0deg,#302b2740,#302b270a),url('+JSON.stringify(data)+')';el.style.backgroundSize='cover';el.style.backgroundPosition='center'}toast('个人背景已选择，点击保存即可')})}function editFamilyCover(){sheet('<div class="row"><h2>家庭公共背景</h2><button class="pill" onclick="familySettings()">返回</button></div><div class="familyCover familyCoverPreview"'+photoBackground(familyCover)+'></div><p class="muted">三个人共同的空间背景。正式版由管理员设置，所有家庭成员同步可见。</p><label class="uploadAvatar">＋ 从相册选择背景<input type="file" accept="image/*" onchange="chooseFamilyCover(event)"></label><button class="primary" onclick="saveFamilyCover()">保存家庭背景</button>')}let pendingFamilyCover=null;function chooseFamilyCover(event){imagePicker(event,data=>{pendingFamilyCover=data;let el=document.querySelector('.familyCoverPreview');if(el){el.style.backgroundImage='linear-gradient(0deg,#302b2740,#302b270a),url('+JSON.stringify(data)+')';el.style.backgroundSize='cover';el.style.backgroundPosition='center'}toast('已选择家庭背景')})}function saveFamilyCover(){if(pendingFamilyCover!==null){familyCover=pendingFamilyCover;pendingFamilyCover=null;try{localStorage.setItem('shiguangFamilyCover',familyCover)}catch(e){toast('图片太大，可能无法持久保存')}}closeSheet();render();toast('家庭背景已更新（仅此浏览器）')}function editMember(i){let m=family[i];sheet('<div class="row"><h2>我的小名片</h2><button class="pill" onclick="familySettings()">返回</button></div><div class="profilePreview">'+(m.photo?'<img src="'+m.photo+'" alt="当前头像">':m.icon)+'</div><div class="profileBackgroundPreview"'+photoBackground(m.background||'')+'></div><label class="uploadAvatar">＋ 从相册选择个人背景<input type="file" accept="image/*" onchange="chooseProfileBackground(event,'+i+')"></label><label class="uploadAvatar">＋ 从相册选择头像<input type="file" accept="image/*" onchange="chooseAvatar(event,'+i+')"></label><p class="muted" style="text-align:center">支持从 iPad 相册选照片，当前仅保存在本机浏览器</p><label>昵称<input id="memberName" class="field" maxlength="24" value="'+esc(m.name)+'" placeholder="想让家人怎么称呼你？"></label><button class="primary" onclick="saveMember('+i+')">保存个人资料</button>')}function chooseAvatar(event,i){let file=event.target.files&&event.target.files[0];if(!file)return;if(!file.type.startsWith('image/'))return toast('请选择图片');if(file.size>5*1024*1024)return toast('请选小于5MB的图片');let reader=new FileReader();reader.onload=()=>{family[i].photo=reader.result;let preview=document.querySelector('.profilePreview');if(preview)preview.innerHTML='<img src="'+reader.result+'" alt="新头像">';toast('头像已选择，记得点击保存')};reader.readAsDataURL(file)}function saveMember(i){let n=$('memberName').value.trim();if(!n)return toast('请输入昵称');family[i].name=n;try{localStorage.setItem('shiguangFamilyDemo',JSON.stringify(family))}catch(e){toast('头像过大，刷新后可能无法保留')}familySettings();render();toast('个人资料已保存')} function inviteFamily(){sheet('<div class="row"><h2>邀请家人</h2><button class="pill" onclick="familySettings()">返回</button></div><p>正式版将生成一次性邀请链接或邀请码，由管理员批准后加入。</p><div class="security"><strong>🔐 安全提醒</strong><p class="muted">演示版不会生成真实有效的邀请，也不会开放照片访问权限。身份验证需要微信登录和服务端权限校验。</p></div><button class="primary" onclick="familySettings()">知道啦</button>')}function showArchive(){sheet('<div class="row"><h2>备份与归档</h2><button class="pill" onclick="closeSheet()">关闭 ✕</button></div><p>正式版会在电脑确认备份原图后，仅在云端保留缩略图、描述和相册记录。</p><p class="muted">目前仅演示归档状态，不会删除任何真实照片。</p><button class="primary" onclick="closeSheet();filter=\'archived\';go(\'albums\')">查看已归档照片</button>')}render();
</script></body></html>
