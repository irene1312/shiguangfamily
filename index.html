<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>拾光 · 家庭相册</title><style>
:root{--bg:#faf8f4;--ink:#302b27;--muted:#968a7e;--accent:#977c63}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0}main{max-width:480px;margin:auto;padding:27px 20px 115px;min-height:100vh}.eyebrow{font-size:10px;letter-spacing:2.8px;color:var(--accent)}h1{font-size:37px;letter-spacing:2px;margin:9px 0 4px}h2{font-size:24px;margin:28px 0 16px}p{line-height:1.75}.muted{color:var(--muted);font-size:13px}.hero{height:265px;position:relative;border-radius:23px;overflow:hidden;margin-top:27px;background:linear-gradient(145deg,#e6d5b5,#8fa99e 65%,#566b61)}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 72% 23%,#fff4d5,transparent 35%),linear-gradient(0deg,#273d38bb,transparent 70%)}.hero>div{position:absolute;bottom:24px;left:23px;color:white}.hero h2{margin:7px 0;font-size:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{min-width:0;text-align:left;background:none;padding:0;color:inherit}.art{height:164px;border-radius:16px;background:linear-gradient(145deg,#e8c59a,#89a69b);position:relative;overflow:hidden}.art:after{content:"";position:absolute;width:130%;height:45%;bottom:-17%;left:-10%;border-radius:50%;background:#637f76a8}.art.b{background:linear-gradient(130deg,#d3aa82,#b16e52,#594e46)}.art.c{background:linear-gradient(145deg,#d2b89b,#a3ad9a,#66867e)}.art.d{background:linear-gradient(130deg,#c8c5b2,#e5c6a2,#b57b61)}.card strong{display:block;margin:11px 0 3px;font-size:16px}.panel{background:#f0eae2;border-radius:19px;padding:22px;margin-top:28px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;background:#fffdfaf5;backdrop-filter:blur(15px);border-top:1px solid #ebe5dc;padding:12px 6px calc(14px + env(safe-area-inset-bottom));z-index:20}.nav button{background:none;color:#91867a;font-size:12px;display:grid;gap:4px;place-items:center}.nav button.active{color:#5b4938}.nav i{font-style:normal;font-size:22px}.nav .plus{width:49px;height:49px;border-radius:50%;background:#947960;color:white;font-size:28px;box-shadow:0 7px 18px #8a715040}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{border-radius:99px;padding:10px 15px;background:#efe9e1;color:#705e4e;font-size:13px}.pill.active{background:#806a57;color:white}.photo{height:330px;border-radius:22px;background:linear-gradient(155deg,#f1d6a7,#a4baa6 58%,#5b7971)}.sheet{position:fixed;inset:0;background:#1d1a1780;z-index:40;display:flex;align-items:end;justify-content:center}.sheet>section{width:min(100%,480px);max-height:89vh;overflow:auto;background:#faf8f4;border-radius:25px 25px 0 0;padding:24px 22px 45px;animation:rise .25s ease}@keyframes rise{from{transform:translateY(30px);opacity:.6}}.field{display:block;width:100%;border:1px solid #e3d9ce;border-radius:12px;background:white;padding:13px;margin:10px 0 16px;outline-color:#a18b73}.primary{width:100%;background:#806b57;color:white;border-radius:15px;padding:15px;margin-top:13px}.line{padding:17px 0;border-bottom:1px solid #e8e1d8}.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.story{border-left:2px solid #c6b19b;padding-left:15px;margin:23px 0}.tag{display:inline-block;background:#f0e8dd;border-radius:30px;padding:8px 12px;margin:4px;font-size:12px}#toast{position:fixed;bottom:105px;left:50%;transform:translateX(-50%);background:#413a34;color:white;border-radius:20px;padding:10px 18px;z-index:99;display:none;white-space:nowrap}
</style><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&display=swap');
:root{--bg:#faf8f4;--ink:#34302c;--accent:#8c7560}body{background:radial-gradient(ellipse at 95% 0%,#f5ede2,transparent 44%),#faf8f4}main{padding-top:34px}h1,h2,.card strong{font-family:"Noto Serif SC","Songti SC",serif}h1{font-weight:500;font-size:39px}h2{font-weight:500;letter-spacing:.4px}.eyebrow{letter-spacing:3px;font-weight:600}.hero{height:clamp(310px,75vw,415px);border-radius:8px 90px 8px 8px;box-shadow:0 20px 45px #6e6d5a1c;animation:heroShape 12s ease-in-out infinite alternate}.hero:before{background:radial-gradient(ellipse at 74% 20%,#fff5d7 0%,transparent 32%),linear-gradient(150deg,transparent 25%,#4b5f58aa 100%),linear-gradient(35deg,#af9174,#a8b5a5)}@keyframes heroShape{0%{border-radius:8px 90px 8px 8px}50%{border-radius:8px 8px 105px 8px}100%{border-radius:90px 8px 8px 8px}}.hero h2{font-size:28px;line-height:1.5}.panel{background:#f2ede6;border:1px solid #eae2d9;border-radius:19px}.card .art{border-radius:6px 32px 6px 6px;box-shadow:0 12px 25px #564a3b14}.card:nth-child(2n) .art{border-radius:32px 6px 6px 6px}.card{transition:transform .2s}.card:active{transform:scale(.97)}.pill{transition:background .2s,transform .2s}.pill:active{transform:scale(.96)}.sheet{z-index:100}.sheet>section{box-shadow:0 -18px 50px #17130f24}.sheetGrip{height:4px;width:44px;background:#d4c7ba;border-radius:10px;margin:-9px auto 21px}.nav{z-index:30}.member{display:flex;gap:15px;align-items:center;padding:14px 0;border-bottom:1px solid #e9e0d6}.member>div:nth-child(2){flex:1}.avatar{width:57px;height:57px;border-radius:50%;background:#eee1d2;font-size:27px}.familyAvatars{display:flex;gap:20px;margin:23px 0}.memberMini{background:none;display:grid;justify-items:center;gap:6px;color:#5f5246}.memberMini span{font-size:27px;background:#e8dfd4;border-radius:50%;height:60px;width:60px;display:grid;place-items:center}.memberMini small{font-size:12px}.security{padding:18px;background:#eaece5;border-radius:16px;margin-top:20px}.security p{margin-bottom:0}.activityLine{display:flex;align-items:center;gap:13px;padding:13px 0;border-top:1px solid #e2d9cf}.activityIcon{background:#e6dace;border-radius:50%;width:39px;height:39px;display:grid;place-items:center}.activityLine strong{font-size:13px}.activityLine .muted{font-size:11px;margin-top:3px}@media(prefers-reduced-motion:reduce){.hero{animation:none}}
</style></head><body><main id="app"></main><nav class="nav" id="nav"></nav><div id="modal"></div><div id="toast"></div><script>
const samples=[{id:1,title:'杭州的秋天',date:'2026-10-03',who:'妈妈',place:'杭州 · 西湖',text:'那天的阳光很好，湖面亮晶晶的。平凡的散步，也值得记住。',album:'旅行日记',art:'a',archived:false},{id:2,title:'家的味道',date:'2026-09-28',who:'爸爸',place:'家里',text:'今天做了好多好吃的，等你回来一起吃。',album:'日常生活',art:'b',archived:false},{id:3,title:'路上的风景',date:'2026-08-12',who:'我',place:'西安',text:'傍晚的风吹过城墙，刚好拍下这一刻。',album:'旅行日记',art:'c',archived:true},{id:4,title:'一些小日子',date:'2025-10-09',who:'妈妈',place:'家里',text:'普通的日子里，也有很多可爱的瞬间。',album:'珍贵回忆',art:'d',archived:true}];let family=[{name:'爸爸',icon:'👨',role:'家庭成员'},{name:'妈妈',icon:'👩',role:'家庭成员'},{name:'我',icon:'🌷',role:'管理员'}],photos=[...samples],albums=['旅行日记','日常生活','珍贵回忆'],tab='home',filter='all',query='',selected=[],pending=[],notice=false;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2400)}function nav(){ $('nav').innerHTML=[['home','⌂','时光'],['albums','▦','相册'],['upload','+',''],['search','⌕','搜索'],['me','◯','我的']].map(([id,ic,label])=>'<button class="'+(tab===id?'active ':'')+(id==='upload'?'plus':'')+'" onclick="'+(id==='upload'?'openUpload()':"go('"+id+"')")+'"><i>'+ic+'</i>'+label+'</button>').join('')}function go(t){tab=t;render();scrollTo({top:0,behavior:'smooth'})}function card(p){return '<button class="card" onclick="detail('+p.id+')"><div class="art '+p.art+'"></div><strong>'+esc(p.title)+'</strong><span class="muted">'+esc(p.date)+' · '+esc(p.who)+(p.archived?' · 已归档':'')+'</span></button>'}function render(){nav();let a=$('app');if(tab==='home')a.innerHTML='<div class="eyebrow">OUR FAMILY JOURNAL</div><div class="row"><div><h1>拾光<span style="color:#b59c81">。</span></h1><div class="muted">把平凡的日子，慢慢收藏起来。</div></div><span style="font-size:30px;color:#b69d86">♡</span></div><div class="hero"><div><div class="eyebrow" style="color:#f8eadb">LITTLE MOMENTS, BIG MEMORIES</div><h2>日子很长，回忆很暖。</h2><div style="font-size:12px">属于我们三个人的时光</div></div></div><div class="row"><h2>最近的故事</h2><button class="pill" onclick="go(\'albums\')">查看全部 →</button></div><div class="grid">'+photos.slice(0,2).map(card).join('')+'</div><div class="panel"><div class="eyebrow">FAMILY UPDATES</div><h2 style="margin:9px 0">家人的新动态</h2><p class="muted">妈妈收藏了新的生活瞬间 · '+photos.length+' 张回忆正在这里等你</p></div><div class="panel"><div class="eyebrow">ON THIS DAY</div><h2 style="margin:9px 0">时光回忆</h2><p class="muted">翻翻以前的照片，看看我们一起走过的日子。</p><button class="pill" onclick="detail(4)">看看过去 →</button></div>';else if(tab==='albums')a.innerHTML='<div class="eyebrow">OUR COLLECTIONS</div><h1>相册</h1><p class="muted">全部照片是完整照片库；按相册是你为照片整理的主题合集。一张照片可以属于多个相册，未分类照片也会留在全部照片中。</p><div class="row" style="justify-content:start;flex-wrap:wrap;margin:24px 0">'+[['all','全部照片'],['albums','按相册'],['archived','已归档']].map(([v,t])=>'<button class="pill '+(filter===v?'active':'')+'" onclick="filter=\''+v+'\';render()">'+t+'</button>').join('')+'</div>'+(filter==='albums'?'<div class="row"><h2>我们的故事</h2><button class="pill" onclick="newAlbum()">＋ 新建</button></div>'+albums.map((x,i)=>'<div class="line" onclick="albumView(\''+esc(x)+'\')" style="cursor:pointer"><strong>'+esc(x)+'</strong><div class="muted">'+photos.filter(p=>p.album===x).length+' 张照片　›</div></div>').join(''):'<div class="grid">'+photos.filter(p=>filter!=='archived'||p.archived).map(card).join('')+'</div>');else if(tab==='search')a.innerHTML='<div class="eyebrow">FIND A MEMORY</div><h1>寻找回忆</h1><input class="field" placeholder="搜索人物、地点、相册、描述…" value="'+esc(query)+'" oninput="query=this.value;searchResults()"><div id="results"></div>';else a.innerHTML='<div class="eyebrow">OUR LITTLE SPACE</div><h1>我的</h1><div class="panel"><div class="eyebrow">FAMILY MEMBERS</div><h2>我们的三人世界</h2><div class="familyAvatars">'+family.map((m,i)=>'<button class="memberMini" onclick="editMember('+i+')"><span>'+m.icon+'</span><small>'+esc(m.name)+'</small></button>').join('')+'</div><button class="pill" onclick="familySettings()">管理成员与头像 →</button><p class="muted">🔒 仅受邀成员可查看照片（正式版规划，当前演示不提供真实权限保护）</p></div><div class="panel"><div class="eyebrow">CLOUD STORAGE · DEMO</div><h2>1.8 GB <span class="muted">/ 3.0 GB</span></h2><div style="height:8px;border-radius:8px;background:#dfd6ca"><div style="width:60%;height:100%;border-radius:8px;background:#a88b6d"></div></div><p class="muted">空间数字仅为原型示例</p></div><div class="line row"><span>微信订阅消息提醒（演示）</span><button class="pill" onclick="notice=!notice;render();toast(\'偏好已在当前演示中切换\')">'+(notice?'已开启':'已关闭')+'</button></div><div class="line row"><span>备份与归档</span><button class="pill" onclick="showArchive()">查看 →</button></div>';if(tab==='search')searchResults()}function searchResults(){let q=(query||'').toLowerCase();$('results').innerHTML='<div class="muted" style="margin:20px 0">按照片标题、描述、人物、地点和相册筛选</div><div class="grid">'+photos.filter(p=>[p.title,p.text,p.who,p.place,p.album,p.date].join(' ').toLowerCase().includes(q)).map(card).join('')+'</div>'}function closeSheet(){ $('modal').innerHTML=''}function sheet(s){$('modal').innerHTML='<div class="sheet" onclick="if(event.target===this)closeSheet()"><section><div class="sheetGrip"></div>'+s+'</section></div>'}function detail(id){let p=photos.find(x=>x.id===id);if(!p)return;sheet('<div class="row"><span class="eyebrow">PHOTO STORY</span><button class="pill" onclick="closeSheet()">关闭 ✕</button></div><div class="art '+p.art+'" style="height:320px;margin:20px 0"></div><div class="eyebrow">'+esc(p.date)+'</div><h2 style="margin:10px 0">'+esc(p.title)+'</h2><div class="story">'+esc(p.text||'这一刻，值得收藏。')+'</div><p class="muted">'+esc(p.who)+' 上传 · '+esc(p.place)+' · '+esc(p.album)+'</p><div class="tag">'+(p.archived?'已归档 · 原图在家庭电脑':'云端原图 · 演示')+'</div><div class="row"><button class="pill" onclick="editPhoto('+id+')">编辑信息</button><button class="pill" onclick="toast(\'演示原型暂不支持下载原图\')">下载</button><button class="pill" onclick="deletePhoto('+id+')">删除</button></div>')}function editPhoto(id){let p=photos.find(x=>x.id===id);sheet('<h2>编辑照片故事</h2><label>标题<input id="et" class="field" value="'+esc(p.title)+'"></label><label>描述<textarea id="ed" class="field" rows="4">'+esc(p.text)+'</textarea></label><label>所属相册<select id="ea" class="field">'+albums.map(x=>'<option '+(x===p.album?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select></label><button class="primary" onclick="saveEdit('+id+')">保存修改</button>')}function saveEdit(id){let p=photos.find(x=>x.id===id);p.title=$('et').value;p.text=$('ed').value;p.album=$('ea').value;closeSheet();render();toast('修改已保存（仅当前页面）')}function deletePhoto(id){if(confirm('确定将这张演示照片移除吗？')){photos=photos.filter(p=>p.id!==id);closeSheet();render();toast('已移除')}}function newAlbum(){sheet('<div class="row"><h2>创建新相册</h2><button class="pill" onclick="closeSheet()">关闭 ✕</button></div><input id="newname" class="field" placeholder="例如：2026 国庆旅行"><button class="primary" onclick="addAlbum()">创建相册</button>')}function addAlbum(){let v=$('newname').value.trim();if(!v)return toast('请输入相册名称');if(!albums.includes(v))albums.push(v);closeSheet();filter='albums';render();toast('相册已创建')}function albumView(name){sheet('<div class="row"><h2>'+esc(name)+'</h2><button class="pill" onclick="closeSheet()">关闭</button></div><div class="grid">'+photos.filter(p=>p.album===name).map(card).join('')+'</div><p class="muted">同一张照片可加入多个相册：正式版将支持多选关系。</p>')}function openUpload(){pending=[];sheet('<div class="row"><div class="eyebrow">NEW MEMORIES</div><button class="pill" onclick="closeSheet()">关闭 ✕</button></div><h2>收藏这一刻</h2><p class="muted">照片可以直接上传到全部照片，之后再分类。</p><input type="file" accept="image/*" multiple id="files" class="field" onchange="previewFiles(this)"><div id="preview" class="thumbs"></div><label>共同描述（选填）<textarea class="field" id="caption" placeholder="今天发生了什么值得记住的小事？"></textarea></label><label>相册（选填）<select id="album" class="field"><option value="">暂不分类</option>'+albums.map(x=>'<option>'+esc(x)+'</option>').join('')+'</select></label><label>地点（选填）<input id="place" class="field" placeholder="例如：杭州 · 西湖"></label><p class="muted">默认一家三口可见 · 演示版不会上传至服务器</p><button class="primary" onclick="uploadDemo()">收藏这些照片</button>')}function previewFiles(el){pending=[...el.files];$('preview').innerHTML='';pending.slice(0,18).forEach(f=>{let img=document.createElement('img');img.src=URL.createObjectURL(f);$('preview').append(img)});toast('已选择 '+pending.length+' 张照片')}function uploadDemo(){if(!pending.length)return toast('请先选择照片');let duplicates=pending.filter(f=>photos.some(p=>p.title===f.name));if(duplicates.length&&!confirm('发现 '+duplicates.length+' 张可能重复的照片，仍然继续吗？'))return;let cap=$('caption').value,album=$('album').value||'未分类',place=$('place').value;pending.forEach(f=>photos.unshift({id:Date.now()+Math.random(),title:f.name.replace(/\.[^.]+$/,''),date:new Date().toISOString().slice(0,10),who:'我',place,text:cap,album,art:'c',archived:false}));closeSheet();go('albums');toast('已模拟收藏 '+pending.length+' 张照片');pending=[]}function familySettings(){sheet('<div class="row"><div><div class="eyebrow">PRIVATE FAMILY SPACE</div><h2 style="margin:8px 0">家庭成员</h2></div><button class="pill" onclick="closeSheet()">完成 ✕</button></div><p class="muted">家人头像与昵称可在此预览编辑。正式版只有被邀请并经管理员批准的微信账号才能查看照片。</p><div id="familyList">'+family.map((m,i)=>'<div class="member"><button class="avatar" onclick="editMember('+i+')">'+m.icon+'</button><div><strong>'+esc(m.name)+'</strong><div class="muted">'+m.role+' · 点击头像编辑</div></div><button class="pill" onclick="editMember('+i+')">编辑</button></div>').join('')+'</div><button class="primary" onclick="inviteFamily()">＋ 邀请家人</button><div class="security"><strong>🔒 私密空间 · 规划中的安全机制</strong><p class="muted">仅受邀账号可访问，服务端验证成员身份，管理员可移除成员并立即撤销访问权限。当前公开网页是无登录的 UI 演示，不具备真实访问控制，请勿上传私人照片。</p></div>')}function editMember(i){let m=family[i];sheet('<div class="row"><h2>编辑家庭成员</h2><button class="pill" onclick="familySettings()">返回</button></div><div style="text-align:center;font-size:56px;margin:15px"> '+m.icon+' </div><label>头像样式（演示）<select class="field" id="memberIcon"><option>👨</option><option>👩</option><option>🌷</option><option>👵</option><option>👴</option><option>🧑</option><option>🐱</option><option>🌻</option></select></label><label>昵称<input id="memberName" class="field" value="'+esc(m.name)+'"></label><button class="primary" onclick="saveMember('+i+')">保存</button>')}function saveMember(i){let n=$('memberName').value.trim();if(!n)return toast('请输入昵称');family[i].name=n;family[i].icon=$('memberIcon').value;familySettings();render();toast('成员资料已更新（演示）')}function inviteFamily(){sheet('<div class="row"><h2>邀请家人</h2><button class="pill" onclick="familySettings()">返回</button></div><p>正式版将生成一次性邀请链接或邀请码，由管理员批准后加入。</p><div class="security"><strong>🔐 安全提醒</strong><p class="muted">演示版不会生成真实有效的邀请，也不会开放照片访问权限。身份验证需要微信登录和服务端权限校验。</p></div><button class="primary" onclick="familySettings()">知道啦</button>')}function showArchive(){sheet('<div class="row"><h2>备份与归档</h2><button class="pill" onclick="closeSheet()">关闭 ✕</button></div><p>正式版会在电脑确认备份原图后，仅在云端保留缩略图、描述和相册记录。</p><p class="muted">目前仅演示归档状态，不会删除任何真实照片。</p><button class="primary" onclick="closeSheet();filter=\'archived\';go(\'albums\')">查看已归档照片</button>')}render();
</script></body></html>
