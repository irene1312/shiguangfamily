<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>拾光 · 家庭相册</title><style>
:root{--bg:#faf8f4;--ink:#302b27;--muted:#968a7e;--accent:#977c63}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0}main{max-width:480px;margin:auto;padding:27px 20px 115px;min-height:100vh}.eyebrow{font-size:10px;letter-spacing:2.8px;color:var(--accent)}h1{font-size:37px;letter-spacing:2px;margin:9px 0 4px}h2{font-size:24px;margin:28px 0 16px}p{line-height:1.75}.muted{color:var(--muted);font-size:13px}.hero{height:265px;position:relative;border-radius:23px;overflow:hidden;margin-top:27px;background:linear-gradient(145deg,#e6d5b5,#8fa99e 65%,#566b61)}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 72% 23%,#fff4d5,transparent 35%),linear-gradient(0deg,#273d38bb,transparent 70%)}.hero>div{position:absolute;bottom:24px;left:23px;color:white}.hero h2{margin:7px 0;font-size:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{min-width:0;text-align:left;background:none;padding:0;color:inherit}.art{height:164px;border-radius:16px;background:linear-gradient(145deg,#e8c59a,#89a69b);position:relative;overflow:hidden}.art:after{content:"";position:absolute;width:130%;height:45%;bottom:-17%;left:-10%;border-radius:50%;background:#637f76a8}.art.b{background:linear-gradient(130deg,#d3aa82,#b16e52,#594e46)}.art.c{background:linear-gradient(145deg,#d2b89b,#a3ad9a,#66867e)}.art.d{background:linear-gradient(130deg,#c8c5b2,#e5c6a2,#b57b61)}.card strong{display:block;margin:11px 0 3px;font-size:16px}.panel{background:#f0eae2;border-radius:19px;padding:22px;margin-top:28px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;background:#fffdfaf5;backdrop-filter:blur(15px);border-top:1px solid #ebe5dc;padding:12px 6px calc(14px + env(safe-area-inset-bottom));z-index:20}.nav button{background:none;color:#91867a;font-size:12px;display:grid;gap:4px;place-items:center}.nav button.active{color:#5b4938}.nav i{font-style:normal;font-size:22px}.nav .plus{width:49px;height:49px;border-radius:50%;background:#947960;color:white;font-size:28px;box-shadow:0 7px 18px #8a715040}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{border-radius:99px;padding:10px 15px;background:#efe9e1;color:#705e4e;font-size:13px}.pill.active{background:#806a57;color:white}.photo{height:330px;border-radius:22px;background:linear-gradient(155deg,#f1d6a7,#a4baa6 58%,#5b7971)}.sheet{position:fixed;inset:0;background:#1d1a1780;z-index:40;display:flex;align-items:end;justify-content:center}.sheet>section{width:min(100%,480px);max-height:89vh;overflow:auto;background:#faf8f4;border-radius:25px 25px 0 0;padding:24px 22px 45px;animation:rise .25s ease}@keyframes rise{from{transform:translateY(30px);opacity:.6}}.field{display:block;width:100%;border:1px solid #e3d9ce;border-radius:12px;background:white;padding:13px;margin:10px 0 16px;outline-color:#a18b73}.primary{width:100%;background:#806b57;color:white;border-radius:15px;padding:15px;margin-top:13px}.line{padding:17px 0;border-bottom:1px solid #e8e1d8}.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.story{border-left:2px solid #c6b19b;padding-left:15px;margin:23px 0}.tag{display:inline-block;background:#f0e8dd;border-radius:30px;padding:8px 12px;margin:4px;font-size:12px}#toast{position:fixed;bottom:105px;left:50%;transform:translateX(-50%);background:#413a34;color:white;border-radius:20px;padding:10px 18px;z-index:99;display:none;white-space:nowrap}
</style></head><body><main id="app"></main><nav class="nav" id="nav"></nav><div id="modal"></div><div id="toast"></div><script>
const samples=[{id:1,title:'杭州的秋天',date:'2026-10-03',who:'妈妈',place:'杭州 · 西湖',text:'那天的阳光很好，湖面亮晶晶的。平凡的散步，也值得记住。',album:'旅行日记',art:'a',archived:false},{id:2,title:'家的味道',date:'2026-09-28',who:'爸爸',place:'家里',text:'今天做了好多好吃的，等你回来一起吃。',album:'日常生活',art:'b',archived:false},{id:3,title:'路上的风景',date:'2026-08-12',who:'我',place:'西安',text:'傍晚的风吹过城墙，刚好拍下这一刻。',album:'旅行日记',art:'c',archived:true},{id:4,title:'一些小日子',date:'2025-10-09',who:'妈妈',place:'家里',text:'普通的日子里，也有很多可爱的瞬间。',album:'珍贵回忆',art:'d',archived:true}];let photos=[...samples],albums=['旅行日记','日常生活','珍贵回忆'],tab='home',filter='all',query='',selected=[],pending=[],notice=false;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2400)}function nav(){ $('nav').innerHTML=[['home','⌂','时光'],['albums','▦','相册'],['upload','+',''],['search','⌕','搜索'],['me','◯','我的']].map(([id,ic,label])=>'<button class="'+(tab===id?'active ':'')+(id==='upload'?'plus':'')+'" onclick="'+(id==='upload'?'openUpload()':"go('"+id+"')")+'"><i>'+ic+'</i>'+label+'</button>').join('')}function go(t){tab=t;render();scrollTo({top:0,behavior:'smooth'})}function card(p){return '<button class="card" onclick="detail('+p.id+')"><div class="art '+p.art+'"></div><strong>'+esc(p.title)+'</strong><span class="muted">'+esc(p.date)+' · '+esc(p.who)+(p.archived?' · 已归档':'')+'</span></button>'}function render(){nav();let a=$('app');if(tab==='home')a.innerHTML='<div class="eyebrow">OUR FAMILY JOURNAL</div><div class="row"><div><h1>拾光<span style="color:#b59c81">。</span></h1><div class="muted">把平凡的日子，慢慢收藏起来。</div></div><span style="font-size:30px;color:#b69d86">♡</span></div><div class="hero"><div><div class="eyebrow" style="color:#f8eadb">LITTLE MOMENTS, BIG MEMORIES</div><h2>日子很长，回忆很暖。</h2><div style="font-size:12px">属于我们三个人的时光</div></div></div><div class="row"><h2>最近的故事</h2><button class="pill" onclick="go(\'albums\')">查看全部 →</button></div><div class="grid">'+photos.slice(0,2).map(card).join('')+'</div><div class="panel"><div class="eyebrow">FAMILY UPDATES</div><h2 style="margin:9px 0">家人的新动态</h2><p class="muted">妈妈收藏了新的生活瞬间 · '+photos.length+' 张回忆正在这里等你</p></div><div class="panel"><div class="eyebrow">ON THIS DAY</div><h2 style="margin:9px 0">时光回忆</h2><p class="muted">翻翻以前的照片，看看我们一起走过的日子。</p><button class="pill" onclick="detail(4)">看看过去 →</button></div>';else if(tab==='albums')a.innerHTML='<div class="eyebrow">OUR COLLECTIONS</div><h1>相册</h1><div class="row" style="justify-content:start;flex-wrap:wrap;margin:24px 0">'+[['all','全部照片'],['albums','按相册'],['archived','已归档']].map(([v,t])=>'<button class="pill '+(filter===v?'active':'')+'" onclick="filter=\''+v+'\';render()">'+t+'</button>').join('')+'</div>'+(filter==='albums'?'<div class="row"><h2>我们的故事</h2><button class="pill" onclick="newAlbum()">＋ 新建</button></div>'+albums.map((x,i)=>'<div class="line" onclick="albumView(\''+esc(x)+'\')" style="cursor:pointer"><strong>'+esc(x)+'</strong><div class="muted">'+photos.filter(p=>p.album===x).length+' 张照片　›</div></div>').join(''):'<div class="grid">'+photos.filter(p=>filter!=='archived'||p.archived).map(card).join('')+'</div>');else if(tab==='search')a.innerHTML='<div class="eyebrow">FIND A MEMORY</div><h1>寻找回忆</h1><input class="field" placeholder="搜索人物、地点、相册、描述…" value="'+esc(query)+'" oninput="query=this.value;searchResults()"><div id="results"></div>';else a.innerHTML='<div class="eyebrow">OUR LITTLE SPACE</div><h1>我的</h1><div class="panel"><div class="eyebrow">FAMILY MEMBERS</div><h2>我们的三人世界</h2><p>👨 爸爸　👩 妈妈　🌷 我</p><p class="muted">所有照片默认仅家庭成员可见（演示状态）</p></div><div class="panel"><div class="eyebrow">CLOUD STORAGE · DEMO</div><h2>1.8 GB <span class="muted">/ 3.0 GB</span></h2><div style="height:8px;border-radius:8px;background:#dfd6ca"><div style="width:60%;height:100%;border-radius:8px;background:#a88b6d"></div></div><p class="muted">空间数字仅为原型示例</p></div><div class="line row"><span>微信订阅消息提醒（演示）</span><button class="pill" onclick="notice=!notice;render();toast(\'偏好已在当前演示中切换\')">'+(notice?'已开启':'已关闭')+'</button></div><div class="line row"><span>备份与归档</span><button class="pill" onclick="showArchive()">查看 →</button></div>';if(tab==='search')searchResults()}function searchResults(){let q=(query||'').toLowerCase();$('results').innerHTML='<div class="muted" style="margin:20px 0">按照片标题、描述、人物、地点和相册筛选</div><div class="grid">'+photos.filter(p=>[p.title,p.text,p.who,p.place,p.album,p.date].join(' ').toLowerCase().includes(q)).map(card).join('')+'</div>'}function close(){ $('modal').innerHTML=''}function sheet(s){$('modal').innerHTML='<div class="sheet" onclick="if(event.target===this)close()"><section>'+s+'</section></div>'}function detail(id){let p=photos.find(x=>x.id===id);if(!p)return;sheet('<div class="row"><span class="eyebrow">PHOTO STORY</span><button class="pill" onclick="close()">关闭 ✕</button></div><div class="art '+p.art+'" style="height:320px;margin:20px 0"></div><div class="eyebrow">'+esc(p.date)+'</div><h2 style="margin:10px 0">'+esc(p.title)+'</h2><div class="story">'+esc(p.text||'这一刻，值得收藏。')+'</div><p class="muted">'+esc(p.who)+' 上传 · '+esc(p.place)+' · '+esc(p.album)+'</p><div class="tag">'+(p.archived?'已归档 · 原图在家庭电脑':'云端原图 · 演示')+'</div><div class="row"><button class="pill" onclick="editPhoto('+id+')">编辑信息</button><button class="pill" onclick="toast(\'演示原型暂不支持下载原图\')">下载</button><button class="pill" onclick="deletePhoto('+id+')">删除</button></div>')}function editPhoto(id){let p=photos.find(x=>x.id===id);sheet('<h2>编辑照片故事</h2><label>标题<input id="et" class="field" value="'+esc(p.title)+'"></label><label>描述<textarea id="ed" class="field" rows="4">'+esc(p.text)+'</textarea></label><label>所属相册<select id="ea" class="field">'+albums.map(x=>'<option '+(x===p.album?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select></label><button class="primary" onclick="saveEdit('+id+')">保存修改</button>')}function saveEdit(id){let p=photos.find(x=>x.id===id);p.title=$('et').value;p.text=$('ed').value;p.album=$('ea').value;close();render();toast('修改已保存（仅当前页面）')}function deletePhoto(id){if(confirm('确定将这张演示照片移除吗？')){photos=photos.filter(p=>p.id!==id);close();render();toast('已移除')}}function newAlbum(){sheet('<h2>创建新相册</h2><input id="newname" class="field" placeholder="例如：2026 国庆旅行"><button class="primary" onclick="addAlbum()">创建相册</button>')}function addAlbum(){let v=$('newname').value.trim();if(!v)return toast('请输入相册名称');if(!albums.includes(v))albums.push(v);close();filter='albums';render();toast('相册已创建')}function albumView(name){sheet('<div class="row"><h2>'+esc(name)+'</h2><button class="pill" onclick="close()">关闭</button></div><div class="grid">'+photos.filter(p=>p.album===name).map(card).join('')+'</div><p class="muted">同一张照片可加入多个相册：正式版将支持多选关系。</p>')}function openUpload(){pending=[];sheet('<div class="eyebrow">NEW MEMORIES</div><h2>收藏这一刻</h2><p class="muted">照片可以直接上传到全部照片，之后再分类。</p><input type="file" accept="image/*" multiple id="files" class="field" onchange="previewFiles(this)"><div id="preview" class="thumbs"></div><label>共同描述（选填）<textarea class="field" id="caption" placeholder="今天发生了什么值得记住的小事？"></textarea></label><label>相册（选填）<select id="album" class="field"><option value="">暂不分类</option>'+albums.map(x=>'<option>'+esc(x)+'</option>').join('')+'</select></label><label>地点（选填）<input id="place" class="field" placeholder="例如：杭州 · 西湖"></label><p class="muted">默认一家三口可见 · 演示版不会上传至服务器</p><button class="primary" onclick="uploadDemo()">收藏这些照片</button>')}function previewFiles(el){pending=[...el.files];$('preview').innerHTML='';pending.slice(0,18).forEach(f=>{let img=document.createElement('img');img.src=URL.createObjectURL(f);$('preview').append(img)});toast('已选择 '+pending.length+' 张照片')}function uploadDemo(){if(!pending.length)return toast('请先选择照片');let duplicates=pending.filter(f=>photos.some(p=>p.title===f.name));if(duplicates.length&&!confirm('发现 '+duplicates.length+' 张可能重复的照片，仍然继续吗？'))return;let cap=$('caption').value,album=$('album').value||'未分类',place=$('place').value;pending.forEach(f=>photos.unshift({id:Date.now()+Math.random(),title:f.name.replace(/\.[^.]+$/,''),date:new Date().toISOString().slice(0,10),who:'我',place,text:cap,album,art:'c',archived:false}));close();go('albums');toast('已模拟收藏 '+pending.length+' 张照片');pending=[]}function showArchive(){sheet('<h2>备份与归档</h2><p>正式版会在电脑确认备份原图后，仅在云端保留缩略图、描述和相册记录。</p><p class="muted">目前仅演示归档状态，不会删除任何真实照片。</p><button class="primary" onclick="close();filter=\'archived\';go(\'albums\')">查看已归档照片</button>')}render();
</script></body></html>
